spring:
  application:
    name: newscore-api-gateway
  data:
    elasticsearch:
      repositories:
        # Disabled by default (in-memory search). Enabled under the "elasticsearch" profile.
        enabled: false
  graphql:
    # GraphiQL UI for local exploration at http://localhost:8080/graphiql
    graphiql:
      enabled: true
    schema:
      # Expose the SDL at /graphql/schema for tooling
      printer:
        enabled: true
    cors:
      # Allow the SSR frontend's client-side queries (browser -> gateway is cross-origin).
      # Tighten to the real frontend origin(s) in production.
      allowed-origins: "*"
      allowed-methods: GET,POST

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        # Prometheus scrape endpoint at /actuator/prometheus (Epic 6)
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        # Kubernetes readiness/liveness probes (Epic 5)
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # Publish histogram buckets so Prometheus can compute P50/P95/P99 via histogram_quantile.
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 100ms,200ms,500ms
  # Distributed tracing (ADR-009). Off by default (sampling 0.0); enable by raising the sampling
  # probability and pointing at Tempo, e.g. via the observability stack.
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:0.0}
  otlp:
    tracing:
      endpoint: ${MANAGEMENT_OTLP_TRACING_ENDPOINT:http://tempo:4318/v1/traces}

logging:
  level:
    de.newscore: INFO

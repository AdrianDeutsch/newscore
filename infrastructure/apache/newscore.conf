ServerName newscore.local

# Apache terminates TLS (production) and reverse-proxies to Varnish, which caches and
# forwards misses to the Nuxt SSR frontend:  client -> Apache -> Varnish -> frontend.

ProxyPreserveHost On
ProxyPass        / http://varnish:80/
ProxyPassReverse / http://varnish:80/

# --- Compression -----------------------------------------------------------
<IfModule mod_deflate.c>
    AddOutputFilterByType DEFLATE text/html text/plain text/css application/javascript application/json image/svg+xml
</IfModule>

# --- Security headers ------------------------------------------------------
<IfModule mod_headers.c>
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Content-Security-Policy "default-src 'self'; img-src 'self' https: data:; style-src 'self' 'unsafe-inline'; script-src 'self'"
</IfModule>

# --- Rate limiting ---------------------------------------------------------
# Bandwidth throttle (demonstrative). Per-request rate limiting in production is handled by
# mod_qos / an edge proxy / the ingress.
<IfModule mod_ratelimit.c>
    <Location "/">
        SetOutputFilter RATE_LIMIT
        SetEnv rate-limit 4096
    </Location>
</IfModule>

# --- TLS termination (production) ------------------------------------------
# Enabled automatically once a certificate is mounted at conf/server.crt|key.
<IfModule mod_ssl.c>
    <IfFile /usr/local/apache2/conf/server.crt>
        Listen 443
        <VirtualHost *:443>
            ServerName newscore.local
            SSLEngine on
            SSLCertificateFile    /usr/local/apache2/conf/server.crt
            SSLCertificateKeyFile /usr/local/apache2/conf/server.key
            ProxyPreserveHost On
            ProxyPass        / http://varnish:80/
            ProxyPassReverse / http://varnish:80/
        </VirtualHost>
    </IfFile>
</IfModule>

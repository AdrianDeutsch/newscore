apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      # "Logs for this trace": the gateway's JSON log lines contain the traceId (json profile).
      # $$ is a literal $ in Grafana provisioning files.
      tracesToLogsV2:
        datasourceUid: loki
        customQuery: true
        query: '{service="api-gateway"} |= "$${__trace.traceId}"'

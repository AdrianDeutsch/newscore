# Unit tests for the alert rules: `promtool test rules infrastructure/prometheus/rules.test.yml`
# (run from the repository root; the CI job "prometheus" does that). Each alert gets a series that
# must fire it and, where it matters, one just below the threshold that must not.
rule_files:
  - ../helm/newscore/files/prometheus-rules.yml

evaluation_interval: 1m

tests:
  - name: P95 latency above 500 ms for 2 minutes
    interval: 1m
    input_series:
      # All requests land in the bucket above 1 s: P95 ≈ 1 s.
      - series: 'http_server_requests_seconds_bucket{application="newscore-api-gateway",le="0.5"}'
        values: '0+0x10'
      - series: 'http_server_requests_seconds_bucket{application="newscore-api-gateway",le="1.0"}'
        values: '0+60x10'
      - series: 'http_server_requests_seconds_bucket{application="newscore-api-gateway",le="+Inf"}'
        values: '0+60x10'
    alert_rule_test:
      - eval_time: 10m
        alertname: ApiHighLatencyP95
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "API P95 latency above 500ms"
              description: "The 95th percentile request latency has exceeded 500ms for 2 minutes."

  - name: Fast requests do not raise the latency alert
    interval: 1m
    input_series:
      - series: 'http_server_requests_seconds_bucket{application="newscore-api-gateway",le="0.1"}'
        values: '0+60x10'
      - series: 'http_server_requests_seconds_bucket{application="newscore-api-gateway",le="+Inf"}'
        values: '0+60x10'
    alert_rule_test:
      - eval_time: 10m
        alertname: ApiHighLatencyP95
        exp_alerts: []

  - name: 5xx rate above 1 %
    interval: 1m
    input_series:
      - series: 'http_server_requests_seconds_count{application="newscore-api-gateway",status="200"}'
        values: '0+98x10'
      - series: 'http_server_requests_seconds_count{application="newscore-api-gateway",status="503"}'
        values: '0+2x10'
    alert_rule_test:
      - eval_time: 10m
        alertname: ApiHighErrorRate
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "API 5xx error rate above 1%"
              description: "More than 1% of requests are returning 5xx for 2 minutes."

  - name: 5xx rate below 1 % stays quiet
    interval: 1m
    input_series:
      - series: 'http_server_requests_seconds_count{application="newscore-api-gateway",status="200"}'
        values: '0+999x10'
      - series: 'http_server_requests_seconds_count{application="newscore-api-gateway",status="500"}'
        values: '0+1x10'
    alert_rule_test:
      - eval_time: 10m
        alertname: ApiHighErrorRate
        exp_alerts: []

  # Series with the labels the gateway really exports (one per partition of the article topic).
  - name: Consumer lag above 1000 on one partition
    interval: 1m
    input_series:
      - series: 'kafka_consumer_fetch_manager_records_lag{application="newscore-api-gateway",client_id="consumer-newscore-api-gateway-article-indexer-1",partition="0",topic="newscore_article_events"}'
        values: '0x10'
      - series: 'kafka_consumer_fetch_manager_records_lag{application="newscore-api-gateway",client_id="consumer-newscore-api-gateway-article-indexer-1",partition="1",topic="newscore_article_events"}'
        values: '1500x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: KafkaConsumerLagHigh
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "Kafka consumer lag above 1000"
              description: "The gateway's article-event consumer is more than 1000 records behind for 3 minutes."

  - name: A consumer that keeps up stays quiet
    interval: 1m
    input_series:
      - series: 'kafka_consumer_fetch_manager_records_lag{application="newscore-api-gateway",client_id="consumer-newscore-api-gateway-article-indexer-1",partition="0",topic="newscore_article_events"}'
        values: '0 3 1 0 0 2 0 0 0 0'
    alert_rule_test:
      - eval_time: 9m
        alertname: KafkaConsumerLagHigh
        exp_alerts: []

  - name: Heap above 90 % for 5 minutes
    interval: 1m
    input_series:
      - series: 'jvm_memory_used_bytes{application="newscore-api-gateway",area="heap",id="G1 Old Gen"}'
        values: '950x10'
      - series: 'jvm_memory_max_bytes{application="newscore-api-gateway",area="heap",id="G1 Old Gen"}'
        values: '1000x10'
    alert_rule_test:
      - eval_time: 8m
        alertname: JvmHeapPressure
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "JVM heap usage above 90%"

  - name: Gateway down for a minute
    interval: 1m
    input_series:
      - series: 'up{job="newscore-api-gateway",instance="api-gateway:8080"}'
        values: '1 1 0 0 0'
    alert_rule_test:
      - eval_time: 4m
        alertname: ApiGatewayDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: newscore-api-gateway
              instance: api-gateway:8080
            exp_annotations:
              summary: "api-gateway target is down"
              description: "Prometheus cannot scrape the api-gateway for 1 minute."

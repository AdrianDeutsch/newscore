# Alert rules for the api-gateway — the one copy used everywhere:
#   - docker compose mounts this file into Prometheus (/etc/prometheus/rules.yml),
#   - the Helm chart embeds it in its PrometheusRule (templates/prometheusrule.yaml),
#   - infrastructure/prometheus/rules.test.yml tests it with `promtool test rules`.
# Every metric used here must be exported by the gateway; e2e/tests/observability.spec.ts checks
# that against the running service.
groups:
  - name: newscore-api-gateway
    rules:
      - alert: ApiHighLatencyP95
        expr: >-
          histogram_quantile(0.95,
            sum(rate(http_server_requests_seconds_bucket{application="newscore-api-gateway"}[5m])) by (le)
          ) > 0.5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "API P95 latency above 500ms"
          description: "The 95th percentile request latency has exceeded 500ms for 2 minutes."

      - alert: ApiHighErrorRate
        expr: >-
          sum(rate(http_server_requests_seconds_count{application="newscore-api-gateway",status=~"5.."}[5m]))
          /
          sum(rate(http_server_requests_seconds_count{application="newscore-api-gateway"}[5m]))
          > 0.01
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "API 5xx error rate above 1%"
          description: "More than 1% of requests are returning 5xx for 2 minutes."

      # Client-side lag per partition, as reported by the gateway's own consumer. Micrometer registers
      # it on its 60-second refresh after the consumer has partitions, so it is missing for up to a
      # minute after a start. It stops changing if the consumer stops fetching; a broker-side exporter
      # would be needed to see that. The analytics-service exports no metrics.
      # (records_lag_max is not used: it is a windowed maximum and NaN while no records arrive.)
      - alert: KafkaConsumerLagHigh
        expr: max(kafka_consumer_fetch_manager_records_lag{application="newscore-api-gateway"}) > 1000
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "Kafka consumer lag above 1000"
          description: "The gateway's article-event consumer is more than 1000 records behind for 3 minutes."

      - alert: JvmHeapPressure
        expr: >-
          sum(jvm_memory_used_bytes{application="newscore-api-gateway",area="heap"})
          /
          sum(jvm_memory_max_bytes{application="newscore-api-gateway",area="heap"})
          > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "JVM heap usage above 90%"

      - alert: ApiGatewayDown
        expr: up{job="newscore-api-gateway"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "api-gateway target is down"
          description: "Prometheus cannot scrape the api-gateway for 1 minute."

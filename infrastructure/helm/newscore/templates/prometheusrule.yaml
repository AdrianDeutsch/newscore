{{- if and .Values.monitoring.enabled .Values.monitoring.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ .Release.Name }}-api-gateway
  labels:
    {{- include "newscore.labels" . | nindent 4 }}
spec:
  groups:
    - name: newscore-api-gateway
      rules:
        - alert: ApiHighLatencyP95
          expr: histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket{application="newscore-api-gateway"}[5m])) by (le)) > 0.5
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "API P95 latency above 500ms"
        - alert: ApiHighErrorRate
          expr: sum(rate(http_server_requests_seconds_count{application="newscore-api-gateway",status=~"5.."}[5m])) / sum(rate(http_server_requests_seconds_count{application="newscore-api-gateway"}[5m])) > 0.01
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "API 5xx error rate above 1%"
        - alert: KafkaConsumerLagHigh
          expr: max(kafka_consumer_fetch_manager_records_lag) > 1000
          for: 3m
          labels:
            severity: critical
          annotations:
            summary: "Kafka consumer lag above 1000"
        - alert: ApiGatewayDown
          expr: up{job="newscore-api-gateway"} == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "api-gateway target is down"
{{- end }}

{{- if and .Values.monitoring.enabled .Values.monitoring.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ .Release.Name }}-api-gateway
  labels:
    {{- include "newscore.labels" . | nindent 4 }}
# Same rules as the local Prometheus (files/prometheus-rules.yml), so the two cannot drift apart.
spec:
{{ .Files.Get "files/prometheus-rules.yml" | indent 2 }}
{{- end }}

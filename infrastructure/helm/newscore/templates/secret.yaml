{{- if .Values.secrets.create }}
# Placeholder secret. In production these values are injected by Vault / sealed-secrets and are
# NOT committed; this template only ensures a complete, valid manifest set is rendered.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  labels:
    {{- include "newscore.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets.data }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}

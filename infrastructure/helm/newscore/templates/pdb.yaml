{{- range $name, $component := .Values.components }}
{{- if $component.pdb.enabled }}
{{- $ctx := dict "root" $ "name" $name }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "newscore.componentName" $ctx }}
  labels:
    {{- include "newscore.labels" $ | nindent 4 }}
    {{- include "newscore.selectorLabels" $ctx | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  minAvailable: {{ $component.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "newscore.selectorLabels" $ctx | nindent 6 }}
{{- end }}
{{- end }}

# Default values for the NewsCore umbrella chart.
# Per-environment overrides live in values-staging.yaml / values-prod.yaml.

global:
  imageRegistry: registry.example.com/newscore
  imageTag: latest # overridden per env / by CI ($CI_COMMIT_SHA)
  imagePullPolicy: IfNotPresent
  environment: dev

serviceAccount:
  create: true
  name: ""

ingress:
  enabled: true
  className: nginx
  host: newscore.example.com
  annotations: {}
  tls:
    enabled: true
    secretName: newscore-tls

networkPolicies:
  enabled: true

# Prometheus Operator integration (ServiceMonitor + PrometheusRule).
# Disabled by default because it requires the operator's CRDs to be installed.
monitoring:
  enabled: false
  serviceMonitor:
    path: /actuator/prometheus
    interval: 15s
  prometheusRule:
    enabled: true

secrets:
  # NOTE: placeholders only. In real clusters these are provided by Vault / sealed-secrets,
  # not committed. Templated here so the chart renders a complete, valid manifest set.
  create: true
  data:
    SPRING_DATASOURCE_PASSWORD: "changeme"

# Pod-level security context — OpenShift restricted-v2 compatible (no hardcoded runAsUser;
# the namespace's UID range is applied by the platform).
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

# Container-level hardening.
containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

# Each entry becomes a Deployment + Service (+ optional ConfigMap/HPA/PDB).
components:
  api-gateway:
    image:
      repository: api-gateway
      tag: "" # falls back to global.imageTag
    replicas: 2
    port: 8080
    expose: false # internal ClusterIP only; reached by the frontend in-cluster
    env:
      SPRING_PROFILES_ACTIVE: "elasticsearch,kafka"
      SPRING_ELASTICSEARCH_URIS: "http://elasticsearch:9200"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 768Mi
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilizationPercentage: 70
    pdb:
      enabled: true
      minAvailable: 1
    probes:
      readinessPath: /actuator/health/readiness
      livenessPath: /actuator/health/liveness

  frontend:
    image:
      repository: frontend
      tag: ""
    replicas: 2
    port: 3000
    expose: true # published through the ingress
    env:
      NUXT_GRAPHQL_ENDPOINT: "http://newscore-api-gateway:8080/graphql"
      NUXT_PUBLIC_GRAPHQL_ENDPOINT: "https://newscore.example.com/graphql"
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 8
      targetCPUUtilizationPercentage: 70
    pdb:
      enabled: true
      minAvailable: 1
    probes:
      readinessPath: /
      livenessPath: /

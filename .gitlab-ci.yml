# NewsCore CI pipeline.
# Stages mirror the project standard: validate -> test -> build -> security -> deploy.
# Jobs use `rules`/`needs` so unaffected apps are skipped and the graph stays fast.

stages:
  - validate
  - test
  - build
  - security
  - deploy-staging
  - deploy-prod

variables:
  REGISTRY: registry.example.com/newscore
  JAVA_OPTS: "-Xmx512m"

# ──────────────────────────────────────────────────────────────────────────
# VALIDATE
# ──────────────────────────────────────────────────────────────────────────
lint:frontend:
  stage: validate
  image: node:22-alpine
  script:
    - cd apps/frontend
    - npm ci
    - npm run lint
    - npm run type-check
  rules:
    - changes: ["apps/frontend/**/*"]

lint:java:
  stage: validate
  image: maven:3.9-eclipse-temurin-21
  script:
    - cd apps/api-gateway
    - ./mvnw -B -ntp checkstyle:check
  rules:
    - changes: ["apps/api-gateway/**/*"]

# ──────────────────────────────────────────────────────────────────────────
# TEST
# ──────────────────────────────────────────────────────────────────────────
test:unit:java:
  stage: test
  image: maven:3.9-eclipse-temurin-21
  script:
    - cd apps/api-gateway
    - ./mvnw -B -ntp test -DexcludedGroups=integration
    - ./mvnw -B -ntp jacoco:report
  coverage: '/Total.*?([0-9]{1,3})%/'
  artifacts:
    when: always
    reports:
      junit: apps/api-gateway/target/surefire-reports/TEST-*.xml
    paths:
      - apps/api-gateway/target/site/jacoco/
  rules:
    - changes: ["apps/api-gateway/**/*"]

test:integration:java:
  stage: test
  image: maven:3.9-eclipse-temurin-21
  script:
    - cd apps/api-gateway
    - ./mvnw -B -ntp verify -Dgroups=integration
  needs: ["test:unit:java"]
  rules:
    - changes: ["apps/api-gateway/**/*"]

test:unit:frontend:
  stage: test
  image: node:22-alpine
  script:
    - cd apps/frontend
    - npm ci
    - npm run test:unit -- --run --coverage
  coverage: '/All files\s+\|\s+([0-9.]+)/'
  artifacts:
    when: always
    reports:
      junit: apps/frontend/test-results/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: apps/frontend/coverage/cobertura-coverage.xml
  rules:
    - changes: ["apps/frontend/**/*"]

# ──────────────────────────────────────────────────────────────────────────
# BUILD (container images)
# ──────────────────────────────────────────────────────────────────────────
build:api-gateway:
  stage: build
  image: docker:27
  services: ["docker:27-dind"]
  script:
    - docker build -t $REGISTRY/api-gateway:$CI_COMMIT_SHA apps/api-gateway
    - docker push $REGISTRY/api-gateway:$CI_COMMIT_SHA
  needs: ["test:integration:java"]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"'

build:frontend:
  stage: build
  image: docker:27
  services: ["docker:27-dind"]
  script:
    - docker build -t $REGISTRY/frontend:$CI_COMMIT_SHA apps/frontend
    - docker push $REGISTRY/frontend:$CI_COMMIT_SHA
  needs: ["test:unit:frontend"]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"'

# ──────────────────────────────────────────────────────────────────────────
# SECURITY (image scanning)
# ──────────────────────────────────────────────────────────────────────────
security:trivy:
  stage: security
  image: aquasec/trivy:latest
  script:
    - trivy image --exit-code 1 --severity HIGH,CRITICAL $REGISTRY/api-gateway:$CI_COMMIT_SHA
    - trivy image --exit-code 1 --severity HIGH,CRITICAL $REGISTRY/frontend:$CI_COMMIT_SHA
  needs: ["build:api-gateway", "build:frontend"]
  allow_failure: false
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"'

# ──────────────────────────────────────────────────────────────────────────
# DEPLOY (GitOps via ArgoCD)
# ──────────────────────────────────────────────────────────────────────────
deploy:staging:
  stage: deploy-staging
  image: bitnami/kubectl:latest
  script:
    - |
      argocd app set newscore-staging \
        --helm-set frontend.image.tag=$CI_COMMIT_SHA \
        --helm-set apiGateway.image.tag=$CI_COMMIT_SHA
    - argocd app sync newscore-staging --timeout 120
    - argocd app wait newscore-staging --health --timeout 180
  environment:
    name: staging
    url: https://newscore.staging.example.com
  needs: ["security:trivy"]
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'

deploy:prod:
  stage: deploy-prod
  image: bitnami/kubectl:latest
  script:
    - |
      argocd app set newscore-prod \
        --helm-set frontend.image.tag=$CI_COMMIT_SHA \
        --helm-set apiGateway.image.tag=$CI_COMMIT_SHA
    - argocd app sync newscore-prod --timeout 120
    - argocd app wait newscore-prod --health --timeout 300
  environment:
    name: production
    url: https://newscore.example.com
  when: manual
  needs: ["deploy:staging"]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

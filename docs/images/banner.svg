<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-label="NewsCore — Cloud-native Medienportal">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#111c33"/>
      <stop offset="100%" stop-color="#0a2540"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00DC82"/>
      <stop offset="100%" stop-color="#36e4da"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>

  <!-- Subtle grid motif (cloud-native / pipeline feel) -->
  <g stroke="#1d2c47" stroke-width="1" opacity="0.6">
    <path d="M0 80 H1200 M0 160 H1200 M0 240 H1200"/>
    <path d="M150 0 V320 M350 0 V320 M550 0 V320 M750 0 V320 M950 0 V320 M1050 0 V320"/>
  </g>

  <!-- Accent bar -->
  <rect x="64" y="118" width="6" height="84" rx="3" fill="url(#accent)" filter="url(#soft)"/>

  <!-- Wordmark -->
  <text x="92" y="160" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="64" font-weight="800" fill="#ffffff">
    News<tspan fill="#00DC82">Core</tspan>
  </text>
  <text x="94" y="200" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#9fb3c8">
    Cloud-natives, hochverfügbares Nachrichtenportal
  </text>

  <!-- Tech chips -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600">
    <g transform="translate(94,236)">
      <rect width="92" height="30" rx="15" fill="#00DC82" opacity="0.14"/>
      <text x="46" y="20" text-anchor="middle" fill="#00DC82">Nuxt 3</text>
    </g>
    <g transform="translate(196,236)">
      <rect width="92" height="30" rx="15" fill="#ED8B00" opacity="0.16"/>
      <text x="46" y="20" text-anchor="middle" fill="#f0a747">Java 21</text>
    </g>
    <g transform="translate(298,236)">
      <rect width="118" height="30" rx="15" fill="#e535ab" opacity="0.16"/>
      <text x="59" y="20" text-anchor="middle" fill="#f06fc6">GraphQL BFF</text>
    </g>
    <g transform="translate(426,236)">
      <rect width="104" height="30" rx="15" fill="#36e4da" opacity="0.16"/>
      <text x="52" y="20" text-anchor="middle" fill="#5ef0e8">OpenShift</text>
    </g>
  </g>

  <!-- Right-side architectural glyph: layered cache / pipeline nodes -->
  <g transform="translate(940,70)" opacity="0.92">
    <circle cx="0"   cy="90" r="14" fill="url(#accent)"/>
    <circle cx="80"  cy="40" r="14" fill="#36e4da"/>
    <circle cx="80"  cy="140" r="14" fill="#36e4da"/>
    <circle cx="170" cy="90" r="14" fill="#00DC82"/>
    <g stroke="#36e4da" stroke-width="2" opacity="0.55" fill="none">
      <path d="M14 90 L66 46"/>
      <path d="M14 90 L66 134"/>
      <path d="M94 46 L156 86"/>
      <path d="M94 134 L156 94"/>
    </g>
  </g>
</svg>

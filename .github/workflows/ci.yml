name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # Once a week even without a commit: base images and registries change underneath a repository
  # that nobody touches. That is how `docker compose up --build` broke unnoticed (DEFECT-001).
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-gateway:
    name: api-gateway · Java 21
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # ElasticSearch Testcontainers needs a high mmap count on the runner.
      - name: Tune vm.max_map_count for ElasticSearch
        run: sudo sysctl -w vm.max_map_count=262144
      - name: Build, test & coverage gate (verify)
        working-directory: apps/api-gateway
        run: ./mvnw -B -ntp verify
      - name: Checkstyle
        working-directory: apps/api-gateway
        run: ./mvnw -B -ntp checkstyle:check
      - name: Test and coverage summary
        if: always()
        working-directory: apps/api-gateway
        run: python3 ../../.github/scripts/java-summary.py >> "$GITHUB_STEP_SUMMARY"
      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: apps/api-gateway/target/site/jacoco/
          if-no-files-found: ignore

  frontend:
    name: frontend · Node 24
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - name: Install
        working-directory: apps/frontend
        run: npm ci
      - name: Lint
        working-directory: apps/frontend
        run: npm run lint
      - name: Type check
        working-directory: apps/frontend
        run: npm run type-check
      - name: Unit tests + coverage gate
        working-directory: apps/frontend
        run: npm run test:unit -- --run --coverage
      - name: Build (SSR)
        working-directory: apps/frontend
        run: npm run build

  analytics-service:
    name: analytics-service · Node 24
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: services/analytics-service/package-lock.json
      - name: Install
        working-directory: services/analytics-service
        run: npm ci
      - name: Lint
        working-directory: services/analytics-service
        run: npm run lint
      - name: Unit tests + coverage gate
        working-directory: services/analytics-service
        run: npm run test:unit -- --run --coverage
      - name: Integration tests (PostgreSQL via Testcontainers)
        working-directory: services/analytics-service
        run: npm run test:integration
      - name: Build
        working-directory: services/analytics-service
        run: npm run build

  varnish:
    name: varnish · VCL tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: varnishtest
        run: |
          docker run --rm -v "$PWD/infrastructure/varnish:/etc/varnish:ro" --entrypoint varnishtest \
            varnish:7.7 /etc/varnish/tests/caching.vtc /etc/varnish/tests/invalidation.vtc

  prometheus:
    name: prometheus · alert rule tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: promtool check + test
        run: |
          docker run --rm -v "$PWD/infrastructure:/infra:ro" -w /infra/prometheus --entrypoint sh \
            prom/prometheus:v2.54.1 -c \
            'promtool check rules ../helm/newscore/files/prometheus-rules.yml && promtool test rules rules.test.yml'

  helm:
    name: helm · lint & template
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v3.16.2
      - name: Helm lint
        run: helm lint infrastructure/helm/newscore
      - name: Helm template (staging & prod, with monitoring resources)
        run: |
          helm template newscore infrastructure/helm/newscore -f infrastructure/helm/newscore/values-staging.yaml > /dev/null
          helm template newscore infrastructure/helm/newscore -f infrastructure/helm/newscore/values-prod.yaml > /dev/null
          helm template newscore infrastructure/helm/newscore --set monitoring.enabled=true > /dev/null

  e2e:
    name: e2e · full compose stack + Playwright
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Tune vm.max_map_count for ElasticSearch
        run: sudo sysctl -w vm.max_map_count=262144
      # The same command the README gives: builds all images and waits until every service is healthy.
      - name: Build and start the stack (edge cache + observability)
        run: docker compose --env-file stack-full.env --profile edge --profile observability up --build --wait --wait-timeout 600
      - name: Install test dependencies
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Type check the tests
        working-directory: e2e
        run: npm run lint
      - name: End-to-end tests
        working-directory: e2e
        run: npm test
      - name: Container logs
        if: failure()
        run: docker compose --profile edge --profile observability logs --no-color --tail 300
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report/
          if-no-files-found: ignore

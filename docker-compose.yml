name: newscore

# One-command demo stack: `docker compose up --build`
#   - api-gateway (Spring Boot GraphQL BFF)  -> http://localhost:8080/graphiql
#   - frontend    (Nuxt 3 SSR)               -> http://localhost:3000
#
# Postgres and ElasticSearch are prepared for later epics (metadata / search) and are NOT yet
# consumed by the apps. Start them on demand with: `docker compose --profile data up`

services:
  api-gateway:
    build:
      context: ./apps/api-gateway
    image: newscore/api-gateway:dev
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8080' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    networks: [newscore]

  frontend:
    build:
      context: ./apps/frontend
    image: newscore/frontend:dev
    ports:
      - "3000:3000"
    environment:
      # SSR resolves the gateway via the internal service name; the browser uses the published port.
      NUXT_GRAPHQL_ENDPOINT: http://api-gateway:8080/graphql
      NUXT_PUBLIC_GRAPHQL_ENDPOINT: http://localhost:8080/graphql
    depends_on:
      api-gateway:
        condition: service_healthy
    networks: [newscore]

  # ---- Prepared for later epics (not yet wired into the apps) -------------
  postgres:
    image: postgres:16-alpine
    profiles: [data]
    environment:
      POSTGRES_USER: newscore
      POSTGRES_PASSWORD: newscore
      POSTGRES_DB: newscore
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [newscore]

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    profiles: [data]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    networks: [newscore]

volumes:
  pgdata:

networks:
  newscore:
    driver: bridge
